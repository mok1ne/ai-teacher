<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Время сдавать — подготовка к ЕГЭ и ОГЭ</title>
    <meta name="description" content="ИИ-репетитор для подготовки к ЕГЭ и ОГЭ по проверенным источникам ФИПИ." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <style>
      #boot{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
        background:#ffffff;transition:opacity .35s ease}
      #boot.hide{opacity:0;pointer-events:none}
      #boot .ring{width:44px;height:44px;border-radius:50%;border:3px solid #e6e9f2;border-top-color:#7c3aed;
        animation:bspin .7s linear infinite}
      @keyframes bspin{to{transform:rotate(360deg)}}
      @media (prefers-color-scheme: dark){#boot{background:#0b1020}#boot .ring{border-color:#232a3d;border-top-color:#a276ff}}
    </style>
    <div id="boot"><div class="ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
